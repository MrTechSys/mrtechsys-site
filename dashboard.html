<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mr. TechSys Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    .section-card {
      background-color: #2c1b1b;
      border-radius: 1.25rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      padding: 2rem;
      margin: 1.5rem auto;
      max-width: 800px;
      text-align: center;
    }
    .solution-btn {
      background-color: #f1c40f;
      border: none;
      padding: 12px 20px;
      font-weight: 700;
      border-radius: 8px;
      margin: 12px;
      cursor: pointer;
    }
    .solution-btn:disabled {
      background-color: #777;
      cursor: not-allowed;
    }
    .chat-bubble {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #f1c40f;
      color: black;
      border-radius: 30px;
      padding: 15px;
      font-weight: bold;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <div class="main-wrapper">
    <img src="logo.png" alt="Mr. TechSys Logo" class="logo" />

    <div class="section-card">
      <h2>Welcome to Mr. TechSys</h2>
      <p>Modernize your business with cloud-native automation, real-time dashboards, and AI-assisted workflows.</p>
    </div>

    <div class="section-card">
      <h2>What Can We Help You Build Today?</h2>
      <button class="solution-btn" onclick="location.href='form_pyscript.html'">Small Business CloudFX</button>
      <button class="solution-btn" onclick="location.href='explore_solutions_pyscript.html'">Explore More Solutions</button>
      <button class="solution-btn" disabled>Real Estate Tools</button>
      <button class="solution-btn" disabled>Volunteer Ops</button>
      <button class="solution-btn" disabled>AutoModular Contracts</button>
    </div>

    <div class="section-card">
      <h2>🔍 See SmartOps in Action</h2>
      <p>Preview your future dashboard insights and automation flow before you even deploy.</p>
      <button class="solution-btn" onclick="location.href='sample_dashboard.html'">View Sample Dashboard</button>
    </div>
  </div>

  <div class="chat-bubble" onclick="toggleAssistant()">MrTechSysGPT</div>

  <div id="gpt-modal" style="display:none;position:fixed;bottom:80px;right:20px;width:300px;height:400px;background:#fff;border-radius:10px;padding:10px;overflow:auto;box-shadow:0 4px 20px rgba(0,0,0,0.3);">
    <textarea id="userInput" placeholder="Ask me anything..." style="width:100%;height:60px;"></textarea>
    <button onclick="sendToGPT()" style="margin-top:8px;padding:6px 12px;">Send</button>
    <div id="responseBox" style="margin-top:12px;font-size:0.9rem;"></div>
  </div>

  <script>
    function toggleAssistant() {
      const modal = document.getElementById('gpt-modal');
      modal.style.display = modal.style.display === 'none' ? 'block' : 'none';
    }

    async function sendToGPT() {
      const input = document.getElementById('userInput').value;
      const responseBox = document.getElementById('responseBox');
      responseBox.innerHTML = 'Thinking...';

      try {
        const response = await fetch('/api/cloudflip/mrtechsysgpt', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: input })
        });

        const result = await response.json();
        const responseBox = document.getElementById('responseBox');
        responseBox.innerHTML = result.reply || result.error || JSON.stringify(result);
      } catch (err) {
        document.getElementById('responseBox').innerHTML = 'Error reaching MrTechSysGPT.';
      }
    }
  </script>
</body>
</html>
