name = "mrtechsys-site"
pages_build_output_dir = "dist"
compatibility_date = "2024-04-01"

# The site's own database. It used to bind CloudFlip's production database (cloudflip-db), which gave this public site
# read and write access to every CloudFlip table; its five tables now live here (migrations/).
[[d1_databases]]
binding = "DB"
database_name = "mrtechsys-site-db"
database_id = "f01976b1-bbf3-40ab-ac74-247b567df52a"
migrations_dir = "migrations"

[ai]
binding = "AI"

# Note: Cloudflare Pages automatically routes based on the functions directory.
# To handle multiple domains (mrtechsys.com and cloudflip.mrtechsys.com) 
# pointing to different parts of the same build, you can use a _middleware.ts
# or configure Custom Domains in the Cloudflare Pages dashboard.
