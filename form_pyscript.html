<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud Migration Survey – Mr. TechSys</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
    }

    .main-wrapper {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .hero-logo img {
      max-width: 220px;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);
      transition: transform 1s ease;
    }

    .centered {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 30px;
    }

    .form-field {
      margin-bottom: 16px;
    }

    .form-field input,
    .form-field textarea {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      background: #fff;
      color: #000;
    }

    .form-field textarea {
      resize: vertical;
      min-height: 100px;
    }

    .submit-btn {
      background-color: #f1c40f;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      margin-top: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: scale(1.05);
    }

    #confirmation {
      margin-top: 20px;
      font-weight: bold;
      color: #f1c40f;
    }

    #chat-bubble {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #f1c40f;
      color: #000;
      font-weight: bold;
      padding: 12px 16px;
      border-radius: 30px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.4);
      cursor: pointer;
      z-index: 999;
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.5s ease;
    }

    #chat-bubble.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

<body>
  <div class="main-wrapper">

    <!-- Logo -->
    <div class="centered hero-logo">
      <a href="index.html" onclick="spinAndGo(event, this)">
        <img id="mainLogo" src="logo.png" alt="Mr. TechSys Logo" />
      </a>
    </div>

    <!-- Survey Header -->
    <section class="section-card">
      <h2 class="section-title">Cloud Migration Readiness & Optimization Survey</h2>
      <p class="section-text">
        Help us understand your current system setup so we can offer optimized cloud-based solutions with AI-driven workflows.
      </p>
    </section>

    <!-- Form Section -->
    <section class="section-card">
      <form id="cloudfx-form">
        <div class="form-field">
          <input type="text" id="name" name="name" placeholder="Full Name" required />
        </div>
        <div class="form-field">
          <input type="text" id="business" name="business" placeholder="Business Name" required />
        </div>
        <div class="form-field">
          <input type="email" id="email" name="email" placeholder="Email Address" required />
        </div>
        <div class="form-field">
          <textarea id="goals" name="goals" placeholder="What are your biggest operational goals or challenges?" required></textarea>
        </div>
        <button type="submit" class="submit-btn">Submit</button>
        <div id="confirmation"></div>
      </form>
    </section>

    <!-- Footer -->
    <footer class="section-card">
      <p class="section-text" style="text-align: center;">
        <a href="privacy.html">Privacy Policy</a> |
        <a href="terms.html">Terms of Use</a> |
        <a href="cookies.html">Cookie Policy</a><br />
        &copy; 2025 Mr. TechSys Solutions, All Rights Reserved
      </p>
    </footer>
  </div>

<!-- === TexasBot Always-On Assistant === -->
<div id="texasBot" onclick="toggleChatBox()">
  <img src="/texas_bot.png" alt="MrTechSysGPT" />
</div>

<!-- === Texas-shaped Chat Box === -->
<div id="chatBox" class="chat-texas">
  <div class="chat-header">🤖 MrTechSysGPT</div>
  <textarea id="chatInput" placeholder="Ask me anything..."></textarea>
  <button onclick="submitChat()">Send</button>
</div>

  <!-- Scripts -->
  <script>
    function navigateWithSpin(target) {
      const logo = document.getElementById('mainLogo');
      logo.classList.add('spin');
      setTimeout(() => {
        window.location.href = target;
      }, 1000);
    }

    function spinAndGo(event, link) {
      event.preventDefault();
      navigateWithSpin(link.getAttribute('href'));
    }

    setInterval(() => {
      const bubble = document.getElementById("chat-bubble");
      bubble.classList.add("show");
      setTimeout(() => {
        bubble.classList.remove("show");
      }, 5000);
    }, 15000);

    document.getElementById('cloudfx-form').addEventListener('submit', async function (e) {
      e.preventDefault();

      const data = {
        name: document.getElementById('name').value,
        business: document.getElementById('business').value,
        email: document.getElementById('email').value,
        goals: document.getElementById('goals').value
      };

      try {
        const response = await fetch('https://drg21pnoha.execute-api.us-east-1.amazonaws.com/prod/invoke', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });

        if (response.ok) {
          document.getElementById('confirmation').innerText = 'Thanks for trusting Mr. TechSys Services! We’ll follow up soon.';
          document.getElementById('cloudfx-form').reset();
        } else {
          document.getElementById('confirmation').innerText = 'Something went wrong. Please try again.';
        }
      } catch (error) {
        console.error(error);
        document.getElementById('confirmation').innerText = 'Server error. Please try again later.';
      }
    });
  </script>
</body>
</html>
